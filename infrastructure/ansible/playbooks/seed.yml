# ============================================
# FastMeals — Database Seed Playbook
# Populates databases with initial data
# ============================================
# Usage:
#   All DBs:     ansible-playbook playbooks/seed.yml
#   Single DB:   ansible-playbook playbooks/seed.yml -e "target_service=auth-service"
#   Reset first: ansible-playbook playbooks/seed.yml -e "reset_before_seed=true"
# ============================================

---
- name: Seed FastMeals databases
  hosts: bastion
  become: false
  vars_files:
    - ../group_vars/bastion.yml
    - ../group_vars/secrets.yml
  vars:
    target_service: ""
    reset_before_seed: false
    timestamp: "{{ ansible_date_time.iso8601_basic_short }}"

  tasks:
    # --- Ensure code is up to date ---
    - name: Pull latest code from {{ github_branch }}
      ansible.builtin.git:
        repo: "{{ github_repo }}"
        dest: "{{ work_dir }}"
        version: "{{ github_branch }}"
        force: true

    # --- Seed each service ---
    - name: Seed databases
      ansible.builtin.include_tasks: tasks/seed-single-db.yml
      loop: "{{ databases | selectattr('has_seed', 'equalto', true) | list }}"
      loop_control:
        loop_var: db
        label: "{{ db.service }}"
      when: target_service == "" or target_service == db.service

    # --- Summary ---
    - name: Seed summary
      ansible.builtin.debug:
        msg: |
          ✅ Seed complete — {{ timestamp }}
          Reset before seed: {{ reset_before_seed }}
          Services: {{ target_service if target_service else 'ALL' }}