all:
  children:
    bastion:
      hosts:
        fastmeals-bastion:
          ansible_host: 3.91.170.99
          ansible_user: ec2-user
          ansible_ssh_private_key_file: "{{ lookup('env', 'BASTION_SSH_KEY') | default('~/.ssh/fastmeals-bastion.pem', true) }}"
          ansible_python_interpreter: /usr/bin/python3