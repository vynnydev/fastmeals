sonar.projectKey=vynnydev_fastmeals
sonar.organization=vynnydev

# Project info
sonar.projectName=FastMeals
sonar.projectVersion=1.0.0

# ==========================================
# Sources
# ==========================================
sonar.sources=backend/services,frontend/microfrontends

# Inclusions (only TypeScript/JavaScript)
sonar.inclusions=**/*.ts,**/*.tsx,**/*.js,**/*.jsx

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/*.test.ts,\
  **/*.spec.ts,\
  **/*.test.tsx,\
  **/*.spec.tsx,\
  **/test/**,\
  **/tests/**,\
  **/__tests__/**,\
  **/prisma/migrations/**,\
  **/generated/**,\
  **/*.config.ts,\
  **/*.config.js,\
  **/vite.config.ts,\
  **/lambda/**

# ==========================================
# Tests
# ==========================================
sonar.tests=backend/services,frontend/microfrontends
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx

# ==========================================
# Coverage (Vitest lcov reports)
# ==========================================
sonar.javascript.lcov.reportPaths=\
  backend/services/auth-service/coverage/lcov.info,\
  backend/services/products-service/coverage/lcov.info,\
  backend/services/orders-service/coverage/lcov.info,\
  backend/services/delivery-service/coverage/lcov.info,\
  backend/services/optimization-service/coverage/lcov.info,\
  backend/services/reports-service/coverage/lcov.info

# ==========================================
# Duplication exclusions
# ==========================================
# Shared infrastructure code across microservices (identical by design)
sonar.cpd.exclusions=\
  **/infrastructure/http/errors/app-error.ts,\
  **/infrastructure/http/errors/error-handler.ts,\
  **/infrastructure/http/middlewares/auth.middleware.ts,\
  **/infrastructure/http/middlewares/rate-limiter.middleware.ts,\
  **/infrastructure/http/middlewares/role-guard.middleware.ts,\
  **/infrastructure/services/jwt-verify.service.ts,\
  **/infrastructure/http/swagger.ts,\
  **/infrastructure/config/**,\
  **/infrastructure/container/**,\
  **/infrastructure/database/**,\
  **/server.ts,\
  **/lambda/**

# ==========================================
# TypeScript
# ==========================================
sonar.typescript.tsconfigPaths=\
  backend/services/auth-service/tsconfig.json,\
  backend/services/products-service/tsconfig.json,\
  backend/services/orders-service/tsconfig.json,\
  backend/services/delivery-service/tsconfig.json,\
  backend/services/optimization-service/tsconfig.json,\
  backend/services/reports-service/tsconfig.json,\
  frontend/microfrontends/shell/tsconfig.json,\
  frontend/microfrontends/remote-orders/tsconfig.json,\
  frontend/microfrontends/remote-products/tsconfig.json,\
  frontend/microfrontends/remote-delivery/tsconfig.json,\
  frontend/microfrontends/remote-reports/tsconfig.json

# ==========================================
# Encoding
# ==========================================
sonar.sourceEncoding=UTF-8

# ==========================================
# Quality Gate
# ==========================================
# Uses SonarCloud default quality gate:
# - No new bugs
# - No new vulnerabilities
# - New code coverage >= 80%
# - New code duplication < 3%