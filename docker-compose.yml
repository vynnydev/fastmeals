# ============================================
# FastMeals — Docker Compose (Full Platform)
# ============================================
# Usage: docker-compose up --build
# Access: http://localhost (via Nginx)
# RabbitMQ UI: http://localhost:15672 (guest/guest)
# ============================================

services:
  # ═══════════════════════════════════════════
  # DATABASES (one per microservice)
  # ═══════════════════════════════════════════

  auth-db:
    image: postgres:16-alpine
    container_name: fastmeals-auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    ports:
      - "5433:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fastmeals-network

  products-db:
    image: postgres:16-alpine
    container_name: fastmeals-products-db
    environment:
      POSTGRES_DB: products_db
      POSTGRES_USER: products_user
      POSTGRES_PASSWORD: products_pass
    ports:
      - "5434:5432"
    volumes:
      - products_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U products_user -d products_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fastmeals-network

  orders-db:
    image: postgres:16-alpine
    container_name: fastmeals-orders-db
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: orders_user
      POSTGRES_PASSWORD: orders_pass
    ports:
      - "5435:5432"
    volumes:
      - orders_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders_user -d orders_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fastmeals-network

  delivery-db:
    image: postgres:16-alpine
    container_name: fastmeals-delivery-db
    environment:
      POSTGRES_DB: delivery_db
      POSTGRES_USER: delivery_user
      POSTGRES_PASSWORD: delivery_pass
    ports:
      - "5436:5432"
    volumes:
      - delivery_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery_user -d delivery_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fastmeals-network

  reports-db:
    image: postgres:16-alpine
    container_name: fastmeals-reports-db
    environment:
      POSTGRES_DB: reports_db
      POSTGRES_USER: reports_user
      POSTGRES_PASSWORD: reports_pass
    ports:
      - "5437:5432"
    volumes:
      - reports_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reports_user -d reports_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fastmeals-network

  # ═══════════════════════════════════════════
  # INFRASTRUCTURE
  # ═══════════════════════════════════════════

  redis:
    image: redis:7-alpine
    container_name: fastmeals-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fastmeals-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fastmeals-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fastmeals-network

  # ═══════════════════════════════════════════
  # MICROSERVICES
  # ═══════════════════════════════════════════

  auth-service:
    build:
      context: ./backend/services/auth-service
      dockerfile: Dockerfile
    container_name: fastmeals-auth-service
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://auth_user:auth_pass@auth-db:5432/auth_db
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-access-secret-fastmeals-2026
      JWT_REFRESH_SECRET: dev-refresh-secret-fastmeals-2026
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 100
      CORS_ORIGIN: http://localhost:3000
      SERVICE_NAME: auth-service
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fastmeals-network

  products-service:
    build:
      context: ./backend/services/products-service
      dockerfile: Dockerfile
    container_name: fastmeals-products-service
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://products_user:products_pass@products-db:5432/products_db
      JWT_ACCESS_SECRET: dev-access-secret-fastmeals-2026
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 100
      CORS_ORIGIN: http://localhost:3000
      SERVICE_NAME: products-service
    depends_on:
      products-db:
        condition: service_healthy
    networks:
      - fastmeals-network

  orders-service:
    build:
      context: ./backend/services/orders-service
      dockerfile: Dockerfile
    container_name: fastmeals-orders-service
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: production
      PORT: 3003
      DATABASE_URL: postgresql://orders_user:orders_pass@orders-db:5432/orders_db
      JWT_ACCESS_SECRET: dev-access-secret-fastmeals-2026
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 100
      CORS_ORIGIN: http://localhost:3000
      PRODUCTS_SERVICE_URL: http://products-service:3002
      DELIVERY_SERVICE_URL: http://delivery-service:3004
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      SERVICE_NAME: orders-service
    depends_on:
      orders-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      products-service:
        condition: service_started
      delivery-service:
        condition: service_started
    networks:
      - fastmeals-network

  delivery-service:
    build:
      context: ./backend/services/delivery-service
      dockerfile: Dockerfile
    container_name: fastmeals-delivery-service
    ports:
      - "3004:3004"
    environment:
      NODE_ENV: production
      PORT: 3004
      DATABASE_URL: postgresql://delivery_user:delivery_pass@delivery-db:5432/delivery_db
      JWT_ACCESS_SECRET: dev-access-secret-fastmeals-2026
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 100
      CORS_ORIGIN: http://localhost:3000
      ORDERS_SERVICE_URL: http://orders-service:3003
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      SERVICE_NAME: delivery-service
    depends_on:
      delivery-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - fastmeals-network

  optimization-service:
    build:
      context: ./backend/services/optimization-service
      dockerfile: Dockerfile
    container_name: fastmeals-optimization-service
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: production
      PORT: 3005
      JWT_ACCESS_SECRET: dev-access-secret-fastmeals-2026
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 100
      CORS_ORIGIN: http://localhost:3000
      ORDERS_SERVICE_URL: http://orders-service:3003
      DELIVERY_SERVICE_URL: http://delivery-service:3004
      SERVICE_NAME: optimization-service
    depends_on:
      orders-service:
        condition: service_started
      delivery-service:
        condition: service_started
    networks:
      - fastmeals-network

  reports-service:
    build:
      context: ./backend/services/reports-service
      dockerfile: Dockerfile
    container_name: fastmeals-reports-service
    ports:
      - "3006:3006"
    environment:
      NODE_ENV: production
      PORT: 3006
      DATABASE_URL: postgresql://reports_user:reports_pass@reports-db:5432/reports_db
      JWT_ACCESS_SECRET: dev-access-secret-fastmeals-2026
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 100
      CORS_ORIGIN: http://localhost:3000
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-anthropic.claude-sonnet-4-5-20250514}
      SERVICE_NAME: reports-service
    depends_on:
      reports-db:
        condition: service_healthy
    networks:
      - fastmeals-network

# ═══════════════════════════════════════════
# FRONTEND
# ═══════════════════════════════════════════

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost
    container_name: fastmeals-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost
    depends_on:
      auth-service:
        condition: service_started
      products-service:
        condition: service_started
      orders-service:
        condition: service_started
    networks:
      - fastmeals-network

  # ═══════════════════════════════════════════
  # API GATEWAY (Nginx)
  # ═══════════════════════════════════════════

  nginx:
    image: nginx:alpine
    container_name: fastmeals-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - products-service
      - orders-service
      - delivery-service
      - optimization-service
      - reports-service
    networks:
      - fastmeals-network

# ═══════════════════════════════════════════
# VOLUMES
# ═══════════════════════════════════════════

volumes:
  auth_db_data:
  products_db_data:
  orders_db_data:
  delivery_db_data:
  reports_db_data:
  redis_data:
  rabbitmq_data:

# ═══════════════════════════════════════════
# NETWORK
# ═══════════════════════════════════════════

networks:
  fastmeals-network:
    driver: bridge