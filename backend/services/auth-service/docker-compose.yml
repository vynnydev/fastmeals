# ============================================
# Auth Service — Docker Compose (desenvolvimento isolado)
# ============================================
# Uso: cd backend/services/auth-service && docker-compose up
# ============================================

services:
  auth-db:
    image: postgres:16-alpine
    container_name: fastmeals-auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    ports:
      - "5433:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fastmeals-auth-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastmeals-auth-service
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://auth_user:auth_pass@auth-db:5432/auth_db
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-access-secret-fastmeals-2026
      JWT_REFRESH_SECRET: dev-refresh-secret-fastmeals-2026
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 100
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  auth_db_data: