# ============================================
# Products Service — Docker Compose (desenvolvimento isolado)
# ============================================
# Uso: cd backend/services/products-service && docker-compose up
# ============================================

services:
  products-db:
    image: postgres:16-alpine
    container_name: fastmeals-products-db
    environment:
      POSTGRES_DB: products_db
      POSTGRES_USER: products_user
      POSTGRES_PASSWORD: products_pass
    ports:
      - "5434:5432"
    volumes:
      - products_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U products_user -d products_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  products-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastmeals-products-service
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_URL: postgresql://products_user:products_pass@products-db:5432/products_db
      JWT_ACCESS_SECRET: dev-access-secret-fastmeals-2026
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 100
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      products-db:
        condition: service_healthy

volumes:
  products_db_data: