services:
  optimization-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastmeals-optimization-service
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: development
      PORT: 3005
      JWT_ACCESS_SECRET: dev-access-secret-fastmeals-2026
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 100
      CORS_ORIGIN: http://localhost:3000
      ORDERS_SERVICE_URL: http://host.docker.internal:3003
      DELIVERY_SERVICE_URL: http://host.docker.internal:3004