worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ============================================
    # FastMeals — Nginx API Gateway
    # Routes requests to the correct microservice
    # ============================================

    upstream auth_service {
        server auth-service:3001;
    }

    upstream products_service {
        server products-service:3002;
    }

    upstream orders_service {
        server orders-service:3003;
    }

    upstream delivery_service {
        server delivery-service:3004;
    }

    upstream optimization_service {
        server optimization-service:3005;
    }

    upstream reports_service {
        server reports-service:3006;
    }

    server {
        listen 80;
        server_name localhost;

        # CORS headers
        # add_header Access-Control-Allow-Origin * always;
        # add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        # add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        # Handle preflight
        # if ($request_method = 'OPTIONS') {
        #     return 204;
        # }

        # ──────────────────────────────────
        # Health check
        # ──────────────────────────────────

        location /health {
            default_type application/json;
            return 200 '{"gateway":"nginx","status":"healthy"}';
        }

        # ──────────────────────────────────
        # Auth Service — /api/auth/*
        # ──────────────────────────────────

        location /api/auth/ {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ──────────────────────────────────
        # Products Service — /api/products/*
        # ──────────────────────────────────

        location /api/products/ {
            proxy_pass http://products_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/products {
            proxy_pass http://products_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ──────────────────────────────────
        # Optimization Service — /api/orders/optimize-assignment
        # (must be BEFORE orders catch-all)
        # ──────────────────────────────────

        location = /api/orders/optimize-assignment {
            proxy_pass http://optimization_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ──────────────────────────────────
        # Orders Service — /api/orders/*
        # ──────────────────────────────────

        location /api/orders/ {
            proxy_pass http://orders_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/orders {
            proxy_pass http://orders_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ──────────────────────────────────
        # Delivery Service — /api/delivery-persons/*
        # ──────────────────────────────────

        location /api/delivery-persons/ {
            proxy_pass http://delivery_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/delivery-persons {
            proxy_pass http://delivery_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ──────────────────────────────────
        # Reports Service — /api/reports/*
        # ──────────────────────────────────

        location /api/reports/ {
            proxy_pass http://reports_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/reports {
            proxy_pass http://reports_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}