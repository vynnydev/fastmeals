# ==========================================
# Dependabot — Automated Dependency Updates
# ==========================================
# Monitors all project dependencies and opens
# PRs automatically when updates are available.
#
# Docs: https://docs.github.com/en/code-security/dependabot
# ==========================================

version: 2

updates:
  # ==========================================
  # GitHub Actions workflows
  # ==========================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"

  # ==========================================
  # Backend — 6 microservices (npm)
  # ==========================================
  - package-ecosystem: "npm"
    directory: "/backend/services/auth-service"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    labels:
      - "dependencies"
      - "backend"
      - "auth-service"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/backend/services/products-service"
