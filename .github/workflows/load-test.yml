name: Load Testing (k6)

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Test scenario to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - full

jobs:
  load-test:
    name: k6 Load Test (${{ github.event.inputs.scenario }})
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run smoke test
        if: ${{ github.event.inputs.scenario == 'smoke' }}
        run: k6 run load-testing/k6-smoke.js

      - name: Run full load test
        if: ${{ github.event.inputs.scenario == 'full' }}
        run: |
          mkdir -p load-testing/results
          k6 run load-testing/k6-load-test.js

      - name: Upload results
        if: ${{ github.event.inputs.scenario == 'full' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-${{ github.run_number }}
          path: load-testing/results/
          retention-days: 30