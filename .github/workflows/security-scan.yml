name: Security Scan

on:
  push:
    branches: [development, main, improvements]
  pull_request:
    branches: [development, main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly scan every Monday at 6AM UTC

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # --- Backend: audit all 6 services ---
      - name: Audit auth-service
        working-directory: backend/services/auth-service
        run: |
          npm ci
          echo "=== auth-service ==="
          npm audit --audit-level=high --omit=dev || true

      - name: Audit products-service
        working-directory: backend/services/products-service
        run: |
          npm ci
          echo "=== products-service ==="
          npm audit --audit-level=high --omit=dev || true

      - name: Audit orders-service
        working-directory: backend/services/orders-service
        run: |
          npm ci
          echo "=== orders-service ==="
          npm audit --audit-level=high --omit=dev || true

      - name: Audit delivery-service
        working-directory: backend/services/delivery-service
        run: |
          npm ci
          echo "=== delivery-service ==="
          npm audit --audit-level=high --omit=dev || true

      - name: Audit optimization-service
        working-directory: backend/services/optimization-service
        run: |
          npm ci
          echo "=== optimization-service ==="
          npm audit --audit-level=high --omit=dev || true

      - name: Audit reports-service
        working-directory: backend/services/reports-service
        run: |
          npm ci
          echo "=== reports-service ==="
          npm audit --audit-level=high --omit=dev || true

      # --- Frontend: audit all 5 microfrontends ---
      - name: Audit frontend microfrontends
        run: |
          for mfe in shell remote-orders remote-products remote-delivery remote-reports; do
            echo "=== ${mfe} ==="
            cd frontend/microfrontends/${mfe}
            npm ci
            npm audit --audit-level=high --omit=dev || true
            cd ../../..
          done

  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # --- Filesystem scan (source code + dependencies) ---
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0  # Don't fail the build, just report

      # --- SARIF report for GitHub Security tab ---
      - name: Trivy SARIF report
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  docker-scan:
    name: Docker Image Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      matrix:
        service:
          - auth-service
          - products-service
          - orders-service
          - delivery-service
          - optimization-service
          - reports-service

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f backend/services/${{ matrix.service }}/Dockerfile \
            -t fastmeals/${{ matrix.service }}:scan \
            backend/services/${{ matrix.service }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fastmeals/${{ matrix.service }}:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-audit, trivy-scan]
    if: always()

    steps:
      - name: Security scan summary
        run: |
          echo "## 🔒 Security Scan Complete"
          echo ""
          echo "| Check | Status |"
          echo "|-------|--------|"
          echo "| Dependency Audit | ${{ needs.dependency-audit.result }} |"
          echo "| Trivy Scan | ${{ needs.trivy-scan.result }} |"
          echo ""
          echo "View details in the GitHub Security tab → Code scanning alerts"