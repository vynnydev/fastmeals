# ============================================
# FastMeals — Deploy FinOps Dashboard
# Builds and deploys to S3 + CloudFront
# ============================================
# Required GitHub Secrets:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
# ============================================

name: "💰 Deploy FinOps Dashboard"

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/finops/dashboard/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  S3_BUCKET: fastmeals-finops-dashboard
  AWS_REGION: us-east-1
  DASHBOARD_DIR: infrastructure/finops/dashboard

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.DASHBOARD_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.DASHBOARD_DIR }}
        run: npm ci

      - name: Build
        working-directory: ${{ env.DASHBOARD_DIR }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        working-directory: ${{ env.DASHBOARD_DIR }}
        run: |
          aws s3 sync dist/ s3://${{ env.S3_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=3600"

          aws s3 cp dist/index.html s3://${{ env.S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='FastMeals FinOps Dashboard'].Id | [0]" \
            --output text)

          if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "$DIST_ID" \
              --paths "/*"
            echo "✅ CloudFront invalidated: $DIST_ID"
          else
            echo "⚠️ No CloudFront distribution found"
          fi
