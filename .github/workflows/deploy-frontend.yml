name: Deploy Frontend (Amplify)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/microfrontends/**'
  workflow_dispatch:

# NOTE: O Amplify faz auto-deploy via webhook quando detecta push na branch.
# Este workflow serve como fallback manual e para verificar o status do deploy.

env:
  AWS_REGION: us-east-1
  AMPLIFY_APP_ID: dom7pekcheg36
  BRANCH_NAME: improvements

permissions:
  id-token: write
  contents: read

jobs:
  trigger-deploy:
    name: Trigger Amplify Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger Amplify build
        run: |
          echo "🚀 Triggering Amplify build for branch ${{ env.BRANCH_NAME }}..."
          JOB=$(aws amplify start-job \
            --app-id ${{ env.AMPLIFY_APP_ID }} \
            --branch-name ${{ env.BRANCH_NAME }} \
            --job-type RELEASE \
            --region ${{ env.AWS_REGION }} \
            --query "jobSummary.jobId" \
            --output text)
          echo "Job ID: $JOB"
          echo "AMPLIFY_JOB_ID=$JOB" >> $GITHUB_ENV

      - name: Wait for Amplify deploy
        run: |
          echo "⏳ Waiting for Amplify build to complete..."
          for i in $(seq 1 30); do
            STATUS=$(aws amplify get-job \
              --app-id ${{ env.AMPLIFY_APP_ID }} \
              --branch-name ${{ env.BRANCH_NAME }} \
              --job-id ${{ env.AMPLIFY_JOB_ID }} \
              --query "job.summary.status" \
              --output text \
              --region ${{ env.AWS_REGION }})
            echo "  Attempt $i/30: $STATUS"
            if [ "$STATUS" = "SUCCEED" ]; then
              echo "✅ Amplify deploy completed!"
              break
            elif [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELLED" ]; then
              echo "❌ Amplify deploy failed with status: $STATUS"
              exit 1
            fi
            sleep 30
          done

      - name: Print URLs
        run: |
          echo "🌐 Frontend: https://fastmeals.com.br"
          echo "🌐 Amplify:  https://${{ env.BRANCH_NAME }}.${{ env.AMPLIFY_APP_ID }}.amplifyapp.com"
          echo "📦 Build:    5 microfrontends (shell + 4 remotes) consolidated"
