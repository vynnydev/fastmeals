name: CI Frontend (Microfrontends)

on:
  push:
    branches: [development, main, improvements]
    paths:
      - 'frontend/microfrontends/**'
  pull_request:
    branches: [development, main]
    paths:
      - 'frontend/microfrontends/**'

jobs:
  typecheck-and-build:
    name: Build ${{ matrix.mfe }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mfe:
          - shell
          - remote-orders
          - remote-products
          - remote-delivery
          - remote-reports

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/microfrontends/${{ matrix.mfe }}/package-lock.json

      - name: Install dependencies
        working-directory: frontend/microfrontends/${{ matrix.mfe }}
        run: npm ci

      - name: Type check
        working-directory: frontend/microfrontends/${{ matrix.mfe }}
        run: npx tsc --noEmit || true

      - name: Build
        working-directory: frontend/microfrontends/${{ matrix.mfe }}
        run: npm run build
        env:
          VITE_API_URL: https://t2fwiydcrc.execute-api.us-east-1.amazonaws.com
          VITE_ORDERS_URL: /remotes/orders/assets/remoteEntry.js
          VITE_PRODUCTS_URL: /remotes/products/assets/remoteEntry.js
          VITE_DELIVERY_URL: /remotes/delivery/assets/remoteEntry.js
          VITE_REPORTS_URL: /remotes/reports/assets/remoteEntry.js

      - name: Verify build output
        working-directory: frontend/microfrontends/${{ matrix.mfe }}
        run: |
          if [ -d dist ]; then
            echo "✅ Build successful — $(find dist -type f | wc -l) files"
            if [ "${{ matrix.mfe }}" != "shell" ]; then
              ls -la dist/assets/remoteEntry.js 2>/dev/null && echo "✅ remoteEntry.js found" || echo "⚠️  No remoteEntry.js"
            fi
          else
            echo "❌ Build failed — no dist directory"
            exit 1
          fi
