name: CI Frontend

on:
  push:
    branches: [development, main]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [development, main]
    paths:
      - 'frontend/**'

jobs:
  test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://j7193c8hbe.execute-api.us-east-1.amazonaws.com